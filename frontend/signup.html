<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up| PrepPilot</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- Page logo, signup-card , back to home page -->
     <main class="auth-page">
        <a href="index.html" class="logo">
            <span class="logo-mark">PP</span>
            PrePilot
        </a>

        <section class ="auth-card">
            <h1> Create your account</h1>
            <p class="auth-sub">Start practicing for your next interview in a minute.</p>

            <!-- Signup form: JS(auth.js) willread these inputs -->
             <form id="signup-form" novalidate>
                <label for="full-name">Full name</label>
                <input type="text" name="full-name" id="full-name" placeholder="Your name" autocomplete="name" required>

                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="you@example.com" autocomplete="email" required>

                <!-- new password: browser can suggest a strong password -->
                 <label for="password">Password</label>
                 <input type="password" name="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>

                 <!-- confirm password -->
                 <label for="confirm-password">Confirm password</label>
                 <input type="password" name="confirm_password" id="confirm-password" placeholder="Enter password again" autocomplete="new-password" required>

                 <!-- JS shows error here: -->
                  <p id="form-message" class="form-message" role="alert"></p>

                  <button type="submit" class="submit-btn">Create account</button>
             </form>

             <!-- Link for already registered users -->
              <p class="auth-switch">
                Already have an account?
                <a href="login.html">Log in</a>
              </p>
        </section>

        <a href="index.html" class="back-line">← Back to home</a>
     </main>

     <script src="js/auth.js"></script>
</body>
</html>
