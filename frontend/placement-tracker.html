<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Tracker | PrepPilot</title>
    <!-- This page has its own look, so it does NOT use dashboard.css -->
    <link rel="stylesheet" href="css/placement.css">
</head>
<body>
    <div class="tracker">

        <!-- Top bar: logo, page links and the logged-in user (no sidebar on this page) -->
        <header class="topnav">
            <a href="index.html" class="tn-logo">
                <span class="tn-logo-mark">PP</span>
                PrepPilot
            </a>

            <nav class="tn-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="profile.html">Profile</a>
                <a href="mock-interview.html">Mock Interview</a>
                <a href="placement-tracker.html" class="current">Placement Tracker</a>
            </nav>

            <div class="tn-user">
                <div class="tn-avatar" id="user-initials">?</div>
                <div class="tn-user-text">
                    <strong id="user-name">Loading...</strong>
                    <span id="user-email"></span>
                </div>
                <button type="button" id="logout-btn" class="tn-logout">Log out</button>
            </div>
        </header>

        <main class="tn-main">

            <!-- Big heading -->
            <section class="tn-hero">
                <p class="eyebrow">Your job hunt pipeline</p>
                <h1>Placement tracker</h1>
                <p class="hero-note">Add every company you are aiming for, then move it forward stage by stage.</p>
            </section>

            <!-- Form: add a new application (also used to edit one) -->
            <form id="app-form" class="quick-add" novalidate>
                <h2 id="form-title">Add an application</h2>

                <div class="form-grid">
                    <div class="field">
                        <label for="company">Company</label>
                        <input type="text" id="company" maxlength="80" placeholder="e.g. Infosys">
                    </div>

                    <div class="field">
                        <label for="role">Role</label>
                        <input type="text" id="role" maxlength="80" placeholder="e.g. Python Intern">
                    </div>

                    <div class="field">
                        <label for="status">Stage</label>
                        <select id="status">
                            <option value="wishlist">Wishlist</option>
                            <option value="applied">Applied</option>
                            <option value="interview">Interview</option>
                            <option value="offer">Offer</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="applied-date">Applied on (optional)</label>
                        <input type="date" id="applied-date">
                    </div>
                </div>

                <div class="field">
                    <label for="notes">Notes (optional)</label>
                    <textarea id="notes" rows="2" maxlength="500" placeholder="Link, contact person, next round date..."></textarea>
                </div>

                <!-- Error or success text appears here -->
                <p id="app-message" class="app-message"></p>

                <div class="form-buttons">
                    <button type="submit" id="save-app-btn" class="save-btn">Add application</button>
                    <!-- Only shown while editing: JS removes hidden -->
                    <button type="button" id="cancel-edit-btn" class="cancel-btn" hidden>Cancel edit</button>
                </div>
            </form>

            <!-- Pipeline board: 5 stages from left to right, JS puts the cards in the lists -->
            <section class="board" aria-label="Applications by stage">
                <div class="column" data-stage="wishlist">
                    <h3><span>Wishlist</span> <span class="count" id="count-wishlist">0</span></h3>
                    <div class="column-list" id="list-wishlist"></div>
                </div>
                <div class="column" data-stage="applied">
                    <h3><span>Applied</span> <span class="count" id="count-applied">0</span></h3>
                    <div class="column-list" id="list-applied"></div>
                </div>
                <div class="column" data-stage="interview">
                    <h3><span>Interview</span> <span class="count" id="count-interview">0</span></h3>
                    <div class="column-list" id="list-interview"></div>
                </div>
                <div class="column" data-stage="offer">
                    <h3><span>Offer</span> <span class="count" id="count-offer">0</span></h3>
                    <div class="column-list" id="list-offer"></div>
                </div>
                <div class="column" data-stage="rejected">
                    <h3><span>Rejected</span> <span class="count" id="count-rejected">0</span></h3>
                    <div class="column-list" id="list-rejected"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/placement-tracker.js"></script>
</body>
</html>
